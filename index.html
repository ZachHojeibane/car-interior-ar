<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Interior AR Experience</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
  font-family: Arial, sans-serif; }
    .instructions { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
      padding: 14px; border-radius: 12px; background: rgba(20,25,25,.88); color: #fff;
      text-align: center; font-size: 14px; line-height: 1.5; pointer-events: none; }
    .instructions strong { color: #d6f36a; font-size: 17px; }
  </style>

  <script>
    AFRAME.registerComponent('callout', {
      schema: { type: { default: 'ring' }, color: { default: '#d6f36a' } },

      init: function () {
        const root = this.el, C = this.data.color;
        const make = (tag, attrs, parent) => {
          const e = document.createElement(tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          (parent || root).appendChild(e);
          return e;
        };
        const flat = (op) => `shader: flat; color: ${C}; opacity: ${op}; transparent: true; side: double`;

        // Pulsing ring with an expanding ripple
        const ring = (x, y, r) => {
          const g = make('a-entity', { position: `${x} ${y} 0.03` });
          make('a-ring', { 'radius-inner': r - 0.035, 'radius-outer': r, material: flat(1),
            animation: 'property: scale; from: 1 1 1; to: 1.08 1.08 1.08; dir: alternate; dur: 600; loop: true; easing: easeInOutSine' }, g);
          make('a-circle', { radius: r, material: flat(0.12),
            animation: 'property: material.opacity; from: 0.05; to: 0.25; dir: alternate; dur: 600; loop: true' }, g);
          make('a-ring', { 'radius-inner': r - 0.02, 'radius-outer': r, material: flat(0.8),
            animation__ripple: 'property: scale; from: 1 1 1; to: 1.7 1.7 1.7; dur: 1400; loop: true; easing: easeOutQuad',
            animation__fade: 'property: material.opacity; from: 0.8; to: 0; dur: 1400; loop: true; easing: easeOutQuad' }, g);
        };

        // Glowing rectangular frame (+ optional scan line)
        const frame = (x, y, w, h, scan) => {
          const g = make('a-entity', { position: `${x} ${y} 0.03` });
          const t = 0.025, pulse = 'property: material.opacity; from: 1; to: 0.35; dir: alternate; dur: 600; loop: true';
          [[0, h/2, w, t], [0, -h/2, w, t], [-w/2, 0, t, h], [w/2, 0, t, h]].forEach(s =>
            make('a-plane', { position: `${s[0]} ${s[1]} 0`, width: s[2], height: s[3], material: flat(1), animation: pulse }, g));
          make('a-plane', { width: w, height: h, material: flat(0.1) }, g);
          if (scan) {
            make('a-plane', { width: w, height: 0.03, material: flat(0.9), position: `0 ${-h/2} 0.01`,
              animation: `property: position; from: 0 ${-h/2} 0.01; to: 0 ${h/2} 0.01; dur: 1500; loop: true; easing: linear` }, g);
          }
        };

        // Bobbing arrow: rot 0 = up, 180 = down, -90 = right, 90 = left
        const arrow = (x, y, rot) => {
          const g = make('a-entity', { position: `${x} ${y} 0.05`, rotation: `0 0 ${rot}` });
          const b = make('a-entity', {
            animation: 'property: position; from: 0 0 0; to: 0 0.1 0; dir: alternate; dur: 500; loop: true; easing: easeInOutSine' }, g);
          make('a-cylinder', { radius: 0.025, height: 0.2, position: '0 0.1 0', material: flat(1) }, b);
          make('a-cone', { 'radius-bottom': 0.07, 'radius-top': 0, height: 0.14, position: '0 0.27 0', material: flat(1) }, b);
        };

        // Map-pin style pointer (tip points down)
        const pin = (x, y) => {
          const g = make('a-entity', { position: `${x} ${y} 0.08` });
          const b = make('a-entity', {
            animation: 'property: position; from: 0 0 0; to: 0 -0.1 0; dir: alternate; dur: 600; loop: true; easing: easeInOutSine' }, g);
          make('a-cone', { 'radius-bottom': 0.09, 'radius-top': 0, height: 0.22, position: '0 0.11 0', rotation: '0 0 180',
            material: flat(1) }, b);
          make('a-sphere', { radius: 0.11, position: '0 0.31 0', material: flat(1) }, b);
          make('a-sphere', { radius: 0.045, position: '0 0.31 0.09', material: 'shader: flat; color: #18211F' }, b);
        };

        switch (this.data.type) {
          case 'ring':  ring(0, 0, 0.38); arrow(0, 0.85, 180); break;
          case 'panel': frame(0, 0, 0.9, 0.45, true); arrow(0, -0.75, 0); break;
          case 'bar':   frame(0, 0, 1.0, 0.3, false); arrow(-0.95, 0, -90); arrow(0, -0.65, 0); break;
          case 'pin':   ring(0, -0.2, 0.22); pin(0, 0.05); break;
        }

        // Pop-up card
        const popup = make('a-entity', { position: '1.4 0 0.05', class: 'popup',
          animation__in: 'property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 450; easing: easeOutBack; startEvents: pop' });
        make('a-plane', { width: 1.5, height: 0.8,
          material: 'shader: flat; color: #18211F; opacity: 0.94; transparent: true' }, popup);
        make('a-plane', { width: 0.04, height: 0.8, position: '-0.73 0 0.005', material: flat(1) }, popup);
        make('a-text', { value: root.dataset.title || '', color: C, align: 'left', anchor: 'left',
          baseline: 'top', width: 1.3, 'wrap-count': 24, position: '-0.65 0.32 0.01' }, popup);
        make('a-text', { value: root.dataset.body || '', color: '#FFFFFF', align: 'left', anchor: 'left',
          baseline: 'top', width: 1.3, 'wrap-count': 30, position: '-0.65 0.12 0.01' }, popup);

        root.addEventListener('targetFound', () => popup.emit('pop'));
      }
    });
  </script>
</head>

<body>

  <div class="instructions">
    <strong>CAR INTERIOR AR</strong><br>
    Point your camera at one of the four car icons.
  </div>

  <a-scene
    mindar-image="imageTargetSrc: https://raw.githubusercontent.com/ZachHojeibane/car-interior-ar/main/targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

 <!-- 0: SWITCHES / DASHBOARD -->
    <a-entity mindar-image-target="targetIndex: 0" callout="type: bar"
      data-title="TACTILE CONTROLS"
      data-body="Discover the details behind the cabin's analog-style toggle switches."></a-entity>

    <!-- 1: GEAR SHIFTER -->
    <a-entity mindar-image-target="targetIndex: 1" callout="type: pin"
      data-title="THE GEAR SELECTOR"
      data-body="Discover the design and craftsmanship of the gear shifter."></a-entity>

    <!-- 2: DIAL / INSTRUMENT PANEL -->
    <a-entity mindar-image-target="targetIndex: 2" callout="type: panel"
      data-title="INSPIRED BY HISTORY"
      data-body="These dials were inspired by a WW2 submarine."></a-entity>

    <!-- 3: STEERING WHEEL -->
    <a-entity mindar-image-target="targetIndex: 3" callout="type: ring"
      data-title="M SPORT STEERING WHEEL"
      data-body="This steering wheel comes directly from the M Sport line. Our most racy offering."></a-entity>

  </a-scene>

</body>
</html>
